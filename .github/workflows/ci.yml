name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Typecheck
        run: corepack pnpm typecheck

      - name: Build
        run: corepack pnpm build

      - name: Test
        run: corepack pnpm test

      - name: Consumer-install smoke (pack + offline install + import)
        run: |
          set -euo pipefail
          corepack pnpm run build
          TARBALL="$(npm pack --silent | tail -n 1)"
          echo "Packed tarball: $TARBALL"
          SMOKE_DIR="$(mktemp -d)"
          echo "Smoke dir: $SMOKE_DIR"
          cp "$TARBALL" "$SMOKE_DIR/"
          cd "$SMOKE_DIR"
          npm init -y --silent
          npm install "./$(basename "$TARBALL")" --no-audit --no-fund --silent
          node --input-type=module -e "import('./node_modules/@clocklobster/cognito-client/dist/index.js').then(m => { if (!m.CognitoClient) { console.error('CognitoClient export missing'); process.exit(1); } console.log('Consumer-install smoke passed: CognitoClient import OK'); })"

      - name: Dependency audit (blocking)
        run: corepack pnpm audit --audit-level=critical

      - name: Dependency audit (advisory)
        continue-on-error: true
        run: corepack pnpm audit --audit-level=high

      - name: Secret scan
        run: |
          echo "Scanning working tree for secrets..."
          PATTERN_LIT='aws_secret_access''_key'
          if grep -rE -n --exclude-dir=.git --exclude-dir=node_modules --exclude=.git \
            -e 'AKIA[0-9A-Z]{16}' \
            -e '-----BEGIN [A-Z ]*PRIVATE KEY-----' \
            -e 'xox[bpas]-' \
            -e 'ghp_[A-Za-z0-9]{20,}' \
            -e 'sk-(live|test)-[A-Za-z0-9]{10,}' \
            -e "$PATTERN_LIT" -- .; then
            echo "Secret scan failed: potential secret pattern found above."
            exit 1
          fi
          echo "Secret scan passed: no secret patterns found."

      - name: Docs lint
        run: |
          test -f docs/plan-evidence.md || (echo "Docs lint failed: docs/plan-evidence.md missing." && exit 1)
          grep -qF "startsWith('/')" README.md || (echo "Docs lint failed: README returnTo guard missing." && exit 1)
          grep -qF "startsWith('//')" README.md || (echo "Docs lint failed: README protocol-relative rejection missing." && exit 1)
          echo "Docs lint passed."

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan for secrets (gitleaks 8.30.1, checksum-verified)
        run: |
          set -euo pipefail
          V=8.30.1
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_checksums.txt"
          grep "linux_x64.tar.gz" "gitleaks_${V}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${V}_linux_x64.tar.gz" gitleaks
          ./gitleaks git . --redact
